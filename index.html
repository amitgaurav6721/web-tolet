<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tolet - Premium Subscription-Based Web Design Agency</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-[#0b0b0f] text-gray-200 antialiased selection:bg-cyan-500 selection:text-black">

    <div id="promo-banner" class="bg-gradient-to-r from-purple-900 to-cyan-900 text-center py-2 text-xs font-medium tracking-wide border-b border-white/10"></div>

    <header class="sticky top-0 z-50 backdrop-blur-md bg-[#0b0b0f]/80 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="#" class="flex items-center space-x-2 text-xl font-bold text-white tracking-tight">
                <span class="text-cyan-400 font-mono">&lt;/&gt;</span>
                <span id="logo-text"></span>
            </a>
            <nav class="hidden md:flex items-center space-x-8 text-sm font-medium text-gray-400">
                <a href="#" class="text-white hover:text-cyan-400 transition-colors">Home</a>
                <a href="#categories" class="hover:text-cyan-400 transition-colors">Categories</a>
                <a href="#plans" class="hover:text-cyan-400 transition-colors">Plans</a>
                <a href="#portfolio" class="hover:text-cyan-400 transition-colors">Portfolio</a>
                <a href="#" class="hover:text-cyan-400 transition-colors"><i class="fa-solid fa-right-to-bracket mr-1.5"></i>Client Login</a>
                <a href="#" class="hover:text-purple-400 transition-colors"><i class="fa-solid fa-user-shield mr-1.5"></i>Admin</a>
            </nav>
            <div>
                <a href="#plans" class="bg-gradient-to-r from-cyan-500 to-blue-600 text-black font-semibold text-sm px-5 py-2.5 rounded-lg shadow-[0_0_20px_rgba(6,182,212,0.3)] hover:opacity-90 transition-all block">Get Started</a>
            </div>
        </div>
    </header>

    <main class="relative overflow-hidden min-h-[calc(100vh-5rem)] flex items-center">
        <div class="absolute top-1/4 left-1/4 w-80 h-80 bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-[150px] pointer-events-none"></div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-20 grid grid-cols-1 lg:grid-cols-12 gap-12 items-center relative z-10">
            <div class="lg:col-span-7 space-y-6">
                <div class="inline-flex items-center space-x-2 bg-white/5 border border-white/10 px-3 py-1.5 rounded-full text-xs font-semibold tracking-wider text-gray-400 uppercase">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse"></span>
                    <span id="hero-tagline"></span>
                </div>
                <h1 id="hero-title" class="text-4xl sm:text-5xl md:text-6xl font-bold tracking-tight text-white leading-[1.1]"></h1>
                <p id="hero-desc" class="text-base sm:text-lg text-gray-400 max-w-xl font-light leading-relaxed"></p>
                <div class="flex flex-wrap items-center gap-4 pt-4">
                    <a href="#plans" class="bg-gradient-to-r from-cyan-400 to-teal-500 text-black font-semibold text-sm px-6 py-3 rounded-lg shadow-[0_0_25px_rgba(34,211,238,0.2)] hover:opacity-95 transition-all flex items-center space-x-2">
                        <i class="fa-solid fa-bolt text-xs"></i><span>View Plans</span>
                    </a>
                </div>
            </div>
            <div class="lg:col-span-5">
                <div class="bg-[#121218]/90 border border-white/10 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl space-y-6">
                    <h3 class="text-lg font-bold text-white flex items-center space-x-2"><i class="fa-solid fa-rocket text-cyan-400"></i><span>Agency Metrics</span></h3>
                    <div class="grid grid-cols-2 gap-4" id="hero-metrics"></div>
                </div>
            </div>
        </div>
    </main>

    <section id="categories" class="py-20 border-t border-white/5 bg-[#0d0d12]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <div class="mb-16"><span class="text-xs font-semibold uppercase tracking-widest text-cyan-400">Categories</span><h2 class="text-3xl font-bold text-white mt-2">Tailored For Every Industry</h2></div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="categories-grid"></div>
        </div>
    </section>

    <section id="plans" class="py-20 border-t border-white/5 bg-[#0b0b0f]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <div class="mb-12"><span class="text-xs font-semibold uppercase tracking-widest text-purple-400">Pricing Plans</span><h2 class="text-3xl font-bold text-white mt-2">Flexible Subscription Durations</h2></div>
            <div class="flex justify-center space-x-4 mb-12" id="duration-toggles"></div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-stretch" id="pricing-grid"></div>
        </div>
    </section>

    <section id="portfolio" class="py-20 border-t border-white/5 bg-[#0d0d12]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16"><span class="text-xs font-semibold uppercase tracking-widest text-cyan-400">Deliverables</span><h2 class="text-3xl font-bold text-white mt-2">Recent Brand & Web Work</h2></div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="portfolio-grid"></div>
        </div>
    </section>

    <section class="py-20 border-t border-white/5 bg-[#0b0b0f]">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16"><span class="text-xs font-semibold uppercase tracking-widest text-purple-400">Reviews</span><h2 class="text-3xl font-bold text-white mt-2">What Client Brands Say</h2></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8" id="testimonials-grid"></div>
        </div>
    </section>

    <footer class="border-t border-white/5 bg-[#07070a] py-12 text-gray-500 text-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center gap-4">
            <p id="footer-copy"></p>
            <div class="flex space-x-6 text-gray-400" id="footer-links"></div>
        </div>
    </footer>

    <script>
        // ADMIN PANEL DATA OBJECT (Replace this object with database rows in backend)
        const WEBSITE_DATA = {
            logo: "Web Tolet",
            promoBanner: "🎉 SPECIAL OFFER ACTIVE: Use Code OFFER20 for 20% Off your subscription!",
            hero: {
                tagline: "Design & Dev Subscription",
                title: "Your Dedicated Web Design Team. Just A Subscription Away.",
                desc: "We build premium, conversion-optimized websites for business owners of any category. Subscribe to a plan, submit design tasks, and get them delivered one by one.",
                metrics: [
                    { value: "99.9%", label: "Uptime & Speed", icon: "fa-chart-line" },
                    { value: "Unlimited", label: "Design Revisions", icon: "fa-pen-nib" }
                ]
            },
            categories: [
                { title: "E-Commerce", desc: "Shopify, WooCommerce, custom web stores optimized for sales.", icon: "fa-cart-shopping", color: "cyan" },
                { title: "SaaS & Startup", desc: "Interactive landing pages, product pages, dashboard designs.", icon: "fa-server", color: "purple" },
                { title: "Real Estate", desc: "Property listings, booking calendars, interactive maps.", icon: "fa-house-chimney", color: "blue" }
            ],
            durations: [
                { id: "3m", label: "3 Months" },
                { id: "6m", label: "6 Months (10% Off)", active: true },
                { id: "12m", label: "12 Months (20% Off)" }
            ],
            plans: [
                { title: "Basic Plan", desc: "Perfect for small businesses starting out.", price: { "3m": 1200, "6m": 2156, "12m": 3800 }, features: ["1 active design request", "48-hour delivery", "Unlimited revisions"], antiFeatures: ["Dedicated Slack channel"] },
                { title: "Pro Plan", desc: "The ultimate plan for growing brands.", price: { "3m": 2400, "6m": 4316, "12m": 7900 }, features: ["2 active design requests", "Priority 24-hour delivery", "Unlimited revisions", "Dedicated Slack channel"], antiFeatures: [], recommended: true }
            ],
            portfolio: [
                { title: "Nubos Cloud Dashboard", desc: "Premium glassmorphic cloud monitoring dashboard.", category: "SAAS / STARTUP", img: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=600&q=80" },
                { title: "Aura Bank Dashboard", desc: "Vibrant neon analytics and card management panels.", category: "FINTECH", img: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=600&q=80" }
            ],
            testimonials: [
                { name: "Marcus Vance", company: "Peak Fitness", text: "Highly professional team. The subscription model is a game-changer for our constant design iterations.", rating: 5 }
            ],
            footer: {
                copy: "© 2026 Web Tolet. All rights reserved.",
                links: [{ name: "Privacy Policy", url: "#" }, { name: "Terms of Service", url: "#" }]
            }
        };

        // RENDER LOGIC
        document.getElementById('promo-banner').innerText = WEBSITE_DATA.promoBanner;
        document.getElementById('logo-text').innerText = WEBSITE_DATA.logo;
        document.getElementById('hero-tagline').innerText = WEBSITE_DATA.hero.tagline;
        document.getElementById('hero-title').innerText = WEBSITE_DATA.hero.title;
        document.getElementById('hero-desc').innerText = WEBSITE_DATA.hero.desc;
        document.getElementById('footer-copy').innerText = WEBSITE_DATA.footer.copy;

        // Render Hero Metrics
        document.getElementById('hero-metrics').innerHTML = WEBSITE_DATA.hero.metrics.map(m => `
            <div class="bg-gradient-to-b from-white/[0.04] to-transparent border border-white/5 rounded-xl p-4 text-center">
                <i class="fa-solid ${m.icon} text-cyan-400 mb-1 block text-lg"></i>
                <div class="text-xl font-bold text-white">${m.value}</div>
                <div class="text-[11px] text-gray-400 mt-0.5 uppercase">${m.label}</div>
            </div>
        `).join('');

        // Render Categories
        document.getElementById('categories-grid').innerHTML = WEBSITE_DATA.categories.map(c => `
            <div class="bg-[#14141c]/50 border border-white/5 rounded-2xl p-6 text-left hover:border-cyan-500/30 transition-all duration-300">
                <div class="w-12 h-12 rounded-xl bg-cyan-500/10 flex items-center justify-center text-cyan-400 text-xl mb-5"><i class="fa-solid ${c.icon}"></i></div>
                <h3 class="text-lg font-semibold text-white mb-2">${c.title}</h3>
                <p class="text-sm text-gray-400 font-light">${c.desc}</p>
            </div>
        `).join('');

        // Render Portfolio
        document.getElementById('portfolio-grid').innerHTML = WEBSITE_DATA.portfolio.map(p => `
            <div class="group bg-[#14141c]/40 border border-white/5 rounded-2xl overflow-hidden transition-all duration-300 hover:border-white/10">
                <div class="aspect-video w-full overflow-hidden bg-gray-800"><img src="${p.img}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" /></div>
                <div class="p-6"><span class="text-[10px] font-bold tracking-wider text-cyan-400 uppercase">${p.category}</span><h3 class="text-lg font-semibold text-white mt-1 mb-2">${p.title}</h3><p class="text-xs text-gray-400 font-light">${p.desc}</p></div>
            </div>
        `).join('');

        // Active duration controller
        let currentDuration = WEBSITE_DATA.durations.find(d => d.active)?.id || WEBSITE_DATA.durations[0].id;

        function renderPlans() {
            document.getElementById('pricing-grid').innerHTML = WEBSITE_DATA.plans.map(p => `
                <div class="relative bg-[#14141c]/60 border ${p.recommended ? 'border-cyan-500' : 'border-white/5'} rounded-2xl p-8 flex flex-col justify-between">
                    ${p.recommended ? '<span class="absolute -top-3 left-1/2 -translate-x-1/2 bg-cyan-500 text-black text-[10px] font-extrabold px-3 py-1 rounded-full uppercase tracking-wider">Recommended</span>' : ''}
                    <div>
                        <h3 class="text-xl font-bold text-white">${p.title}</h3>
                        <p class="text-xs text-gray-400 mt-2 font-light min-h-[32px]">${p.desc}</p>
                        <div class="my-6"><span class="text-4xl font-extrabold text-white">₹${p.price[currentDuration]}</span> <span class="text-xs text-gray-500">/ period</span></div>
                        <ul class="space-y-3 text-sm text-left pt-2 border-t border-white/5">
                            ${p.features.map(f => `<li class="flex items-start space-x-2.5 text-gray-300"><i class="fa-solid fa-circle-check text-emerald-400 mt-0.5"></i><span>${f}</span></li>`).join('')}
                            ${p.antiFeatures.map(af => `<li class="flex items-start space-x-2.5 text-gray-600 line-through"><i class="fa-solid fa-circle-xmark mt-0.5"></i><span>${af}</span></li>`).join('')}
                        </ul>
                    </div>
                    <button class="w-full mt-8 py-3 rounded-xl font-semibold text-sm transition-all ${p.recommended ? 'bg-gradient-to-r from-cyan-400 to-blue-500 text-black shadow-lg shadow-cyan-500/10' : 'bg-white/5 text-white hover:bg-white/10'}">Subscribe Now</button>
                </div>
            `).join('');
        }

        // Render Toggles
        document.getElementById('duration-toggles').innerHTML = WEBSITE_DATA.durations.map(d => `
            <button onclick="currentDuration='${d.id}'; renderPlans(); updateToggleStyles(this)" class="toggle-btn px-4 py-2 rounded-xl text-xs font-medium transition-all ${d.id === currentDuration ? 'bg-white/10 text-white border border-white/20' : 'text-gray-400 hover:text-white'}">${d.label}</button>
        `).join('');

        window.updateToggleStyles = function(el) {
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('bg-white/10', 'text-white', 'border', 'border-white/20'));
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.add('text-gray-400'));
            el.classList.add('bg-white/10', 'text-white', 'border', 'border-white/20');
        }

        // Render Testimonials
        document.getElementById('testimonials-grid').innerHTML = WEBSITE_DATA.testimonials.map(t => `
            <div class="bg-[#14141c]/30 border border-white/5 rounded-2xl p-6 text-left">
                <div class="flex text-amber-400 space-x-1 mb-4">${Array(t.rating).fill('<i class="fa-solid fa-star text-xs"></i>').join('')}</div>
                <p class="text-sm text-gray-300 font-light italic mb-6">"${t.text}"</p>
                <div><h4 class="text-sm font-bold text-white">${t.name}</h4><p class="text-xs text-gray-500">${t.company}</p></div>
            </div>
        `).join('');

        // Render Footer Links
        document.getElementById('footer-links').innerHTML = WEBSITE_DATA.footer.links.map(l => `<a href="${l.url}" class="hover:text-white transition-colors">${l.name}</a>`).join('');

        // Initial Execution
        renderPlans();
    </script>
</body>
</html>
